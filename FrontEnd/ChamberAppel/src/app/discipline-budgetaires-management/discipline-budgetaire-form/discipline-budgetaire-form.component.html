<!-- header -->
<app-page-action-header [icon]="'fa fa-balance-scale'" [title]="title" [titleMobile]="titleMobile">
  <ng-container>
    <app-header-action-button buttonClass="{{ ReturnButtonStyle }} me-2"
      title="Revenir à la liste des discipline budgetaires" routerLink="/roles" iconClass="fa fa-arrow-left"
      label="Retour"></app-header-action-button>

    <app-header-action-button *ngIf="IsCreateOrUpdate" buttonClass="{{ AddOrEditButtonStyle }}"
      title="Enregistrer les données" iconClass="fa fa-save" label="Enregistrer"
      (clicked)="OnSave()"></app-header-action-button>

    <app-header-action-button *ngIf="IsDelete" buttonClass="{{ DeleteButtonStyle }}" title="Supprimer les données"
      iconClass="fa fa-trash" label="Supprimer" (clicked)="OnDelete()"></app-header-action-button>
  </ng-container>
</app-page-action-header>

<form [formGroup]="ReactiveForm">
  <!-- تسجيل العريضة الاستئناف -->
  <div class="card my-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">تسجيل العريضة الاستئناف</h5>
      <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse"
        data-bs-target="#collapseCard1" aria-expanded="true" aria-controls="collapseCard1">
        <i class="fa fa-angle-double-up"></i>
      </button>
    </div>
    <div id="collapseCard1" class="collapse show">
      <div class="card-body">
        <div class="row">
          <!-- رقم الملف -->
          <div class="col-md-4 form-group my-2">
            <label for="numero_Dossier">رقم الملف</label>
            <input type="text" placeholder="رقم الملف" class="form-control" id="numero_Dossier"
              formControlName="numero_Dossier" />
          </div>

          <!-- طالب الإستئناف -->
          <div class="col-md-4 form-group my-2">
            <label for="appelant">طالب الإستئناف</label>
            <input type="text" placeholder="طالب الإستئناف" class="form-control" id="appelant"
              formControlName="appelant" />
          </div>

          <!-- الحكم المستأنف عدد -->
          <div class="col-md-4 form-group my-2">
            <label for="numero_Jugement_Faisant_Objet_De_Appel">الحكم المستأنف عدد</label>
            <input type="text" placeholder="الحكم المستأنف عدد" class="form-control"
              id="numero_Jugement_Faisant_Objet_De_Appel" formControlName="numero_Jugement_Faisant_Objet_De_Appel" />
          </div>

          <!-- الصادر بتاريخ -->
          <div class="col-md-4 form-group my-2">
            <label for="emis_En_Date_Du">الصادر بتاريخ</label>
            <input type="date" class="form-control" id="emis_En_Date_Du" formControlName="emis_En_Date_Du" />
          </div>

          <!-- المجلس الجهوي للحسابات  -->
          <div class="col-md-4 form-group my-2">
            <label for="idCRC">المجلس الجهوي للحسابات </label>
            <select class="form-control" id="idCRC" formControlName="idCRC">
              <option [value]="null" disabled>{{ DefaultSelectOption }}</option>
              <option *ngFor="let crc of CRCs" [value]="crc.id">{{ crc.label }}</option>
            </select>
          </div>

          <!-- المركز المحاسبي -->
          <div class="col-md-4 form-group my-2">
            <label for="centre_Comptable">المركز المحاسبي</label>
            <input type="text" placeholder="المركز المحاسبي" class="form-control" id="centre_Comptable"
              formControlName="centre_Comptable" />
          </div>

          <!-- تاريخ تسجيل العريضة بالمجلس الجهوي للحسابات -->
          <div class="col-md-4 form-group my-2">
            <label for="date_Enregistrement_Requete_Cour_Regionale_Des_Comptes">تاريخ تسجيل العريضة بالمجلس الجهوي
              للحسابات</label>
            <input type="date" class="form-control" id="date_Enregistrement_Requete_Cour_Regionale_Des_Comptes"
              formControlName="date_Enregistrement_Requete_Cour_Regionale_Des_Comptes" />
          </div>

          <!-- تاريخ  ملتمس النيابة العامة -->
          <div class="col-md-4 form-group my-2">
            <label for="date_Requisition_Ministere_Public">تاريخ ملتمس النيابة العامة</label>
            <input type="text" placeholder="تاريخ  ملتمس النيابة العامة" class="form-control"
              id="date_Requisition_Ministere_Public" formControlName="date_Requisition_Ministere_Public" />
          </div>

          <!-- رقم ملتمس النيابة العامة -->
          <div class="col-md-4 form-group my-2">
            <label for="numero_Requisition_Ministere_Public">رقم ملتمس النيابة العامة</label>
            <input type="text" placeholder="رقم ملتمس النيابة العامة" class="form-control"
              id="numero_Requisition_Ministere_Public" formControlName="numero_Requisition_Ministere_Public" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- تعين المستشار -->

    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">تعين المستشار</h5>

      </button>
    </div>

    <div id="collapseCard2" class="collapse show">
      <div class="card-body">
        <div class="row">
          <!-- تاريخ  أمر تعيين المستشار المقرر -->

              id="date_Ordonnance_Designation_Conseiller_Rapporteur"
              formControlName="date_Ordonnance_Designation_Conseiller_Rapporteur" />
          </div>

          <!-- رقم أمر تعيين المستشار المقرر -->
          <div class="col-md-4 form-group my-2">
            <label for="numero_Ordonnance_Designation_Conseiller_Rapporteur">رقم أمر تعيين المستشار المقرر</label>
            <input type="text" placeholder="رقم أمر تعيين المستشار المقرر" class="form-control"
              id="numero_Ordonnance_Designation_Conseiller_Rapporteur"
              formControlName="numero_Ordonnance_Designation_Conseiller_Rapporteur" />
          </div>

          <!-- المستشار المقرر -->
          <div class="col-md-4 form-group my-2">
            <label for="conseiller_Rapporteur">المستشار المقرر</label>
            <input type="text" placeholder="المستشار المقرر" class="form-control" id="conseiller_Rapporteur"
              formControlName="conseiller_Rapporteur" />
          </div>

          <!-- تاریخ  أمر تعيين المستشار المقرر الخلف -->
          <div class="col-md-4 form-group my-2">
            <label for="date_Ordonnance_Designation_Conseiller_Rapporteur_Remplacant">تاریخ أمر تعيين المستشار المقرر

            <input type="text" placeholder="تاریخ  أمر تعيين المستشار المقرر الخلف" class="form-control"
              id="date_Ordonnance_Designation_Conseiller_Rapporteur_Remplacant"
              formControlName="date_Ordonnance_Designation_Conseiller_Rapporteur_Remplacant" />
          </div>

          <!-- رقم أمر تعيين المستشار المقرر الخلف -->
          <div class="col-md-4 form-group my-2">
            <label for="numero_Ordonnance_Designation_Conseiller_Rapporteur_Remplacant">رقم أمر تعيين المستشار المقرر
              الخلف</label>
            <input type="text" placeholder="رقم أمر تعيين المستشار المقرر الخلف" class="form-control"
              id="numero_Ordonnance_Designation_Conseiller_Rapporteur_Remplacant"
              formControlName="numero_Ordonnance_Designation_Conseiller_Rapporteur_Remplacant" />
          </div>

          <!-- المستشار المقرر الخلف -->
          <div class="col-md-4 form-group my-2">
            <label for="conseiller_Rapporteur_Remplacant">المستشار المقرر الخلف</label>
            <input type="text" placeholder="المستشار المقرر الخلف" class="form-control"
              id="conseiller_Rapporteur_Remplacant" formControlName="conseiller_Rapporteur_Remplacant" />
          </div>
        </div>
      </div>
    </div>
  </div>

          </div>

          <!-- تاريخ توصل الأطراف - عامل الإقليمي-->
          <div class="col-md-4 form-group my-2">

    <div id="collapseCard4" class="collapse show">
      <div class="card-body">

          <!-- تاريخ توصل المتابع بالاستدعاء لأجل الإطلاع -->
          <div class="col-md-4 form-group my-2">

            <input type="text" placeholder="تاريخ توصل المتابع بالاستدعاء لأجل الإطلاع" class="form-control"
